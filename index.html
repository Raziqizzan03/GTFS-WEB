<!DOCTYPE html>
<html>

<head>
<meta charset="utf-8">

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>

body{
margin:0;
}

#map{
height:100vh;
}

#panel{
position:absolute;
top:10px;
left:10px;
z-index:1000;
background:white;
padding:10px;
}

</style>

</head>

<body>

<div id="panel">
<select id="routeSelect">
<option value="">Semua Rute</option>
</select>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

var map = L.map('map')
.setView([-6.2,106.8],11);

L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png'
).addTo(map);

var routeLayer;

fetch('MergeRute.geojson')
.then(r => r.json())
.then(data => {

window.gtfsData = data;

loadRoutes("");

populateDropdown(data);

});

function loadRoutes(selectedRoute){

if(routeLayer){
map.removeLayer(routeLayer);
}

routeLayer = L.geoJSON(
window.gtfsData,
{

filter:function(feature){

if(selectedRoute==""){
return true;
}

return feature.properties.route_id
== selectedRoute;

},

style:function(feature){

return {
color:"#"+feature.properties.route_color,
weight:4
};

},

onEachFeature:function(feature,layer){

layer.bindPopup(
"<b>"+feature.properties.route_id+"</b><br>"
+
feature.properties.route_long_name
);

}

}
).addTo(map);

}

function populateDropdown(data){

let select =
document.getElementById("routeSelect");

let routes = {};

data.features.forEach(f=>{

routes[
f.properties.route_id
] = f.properties.route_long_name;

});

Object.keys(routes)
.sort()
.forEach(r=>{

let option =
document.createElement("option");

option.value = r;

option.text =
r + " - " + routes[r];

select.appendChild(option);

});

}

document
.getElementById("routeSelect")
.addEventListener(
"change",
function(){

loadRoutes(this.value);

}
);

</script>

</body>

</html>
