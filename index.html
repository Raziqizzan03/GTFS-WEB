<!DOCTYPE html>
<html>

<head>
<meta charset="utf-8">

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />

<style>

body{
margin:0;
}

#map{
height:100vh;
}

#panel{
position:absolute;
top:10px;
left:10px;
z-index:1000;
background:white;
padding:10px;
border-radius:5px;
box-shadow:0 0 10px rgba(0,0,0,0.2);
}

select{
width:300px;
padding:5px;
}

button{
width:145px;
padding:6px;
margin-top:5px;
cursor:pointer;
}

.halte-label{
    background:white;
    border:1px solid #666;
    border-radius:4px;
    padding:2px 4px;
    color:black;
    font-size:11px;
    font-weight:bold;
    box-shadow:none;
}
 
</style>

</head>

<body>

<div id="panel">


<select id="routeSelect">
<option value="">Semua Rute</option>
</select>

<br><br>

<select id="tripSelect">
<option value="">Pilih Trip</option>
</select>

<br><br>

<label>
<input type="checkbox" id="showStops">
 Tampilkan Halte
</label>

<br><br>

<button id="addTrip">
Tambah ke Peta
</button>

<button id="clearMap">
Clear
</button>

<button id="showAll">
Lihat Semua
</button>

<button id="downloadRoute">
Download GeoJSON
</button>

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<script>

// =========================
// BUAT PETA
// =========================

var map = L.map('map')
.setView([-6.2,106.8],11);

var cartoLight = L.tileLayer(
'https://basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png?key=cb1_2rqj_1_ceecb152672cf866e0273c66',
{
    attribution:'© OpenStreetMap © CARTO',
    maxZoom:19
});

var osm = L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
    attribution:'© OpenStreetMap'
});

var cartoDark = L.tileLayer(
'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
{
    attribution:'© OpenStreetMap © CARTO'
});

var esriSat = L.tileLayer(
'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
{
    attribution:'Tiles © Esri'
});

var esriStreet = L.tileLayer(
'http://mt0.google.com/vt/lyrs=m&hl=en&x={x}&y={y}&z={z}',
{
    attribution: 'Tiles © Esri'
});

// Basemap awal
cartoLight.addTo(map);

var baseMaps = {
    "Carto Light": cartoLight,
    "OpenStreetMap": osm,
    "Carto Dark": cartoDark,
    "Esri Satellite": esriSat,
    "Google Street": esriStreet
};

L.control.layers(baseMaps, null, {
    position: "topright"
}).addTo(map);

var selectedRouteLayer =
L.layerGroup().addTo(map);

var stopLayer =
L.layerGroup().addTo(map);


// =========================
// LOAD GEOJSON RUTE
// =========================

fetch('data/MergeRuteIBIbaru1.geojson')
.then(r => r.json())
.then(data => {

window.gtfsData = data;

populateRoutes(data);

$('#routeSelect').select2({
    width:'300px',
    placeholder:'Cari Route'
});

populateTrips("");

});

// =========================
// LOAD STOPS
// =========================

fetch('data/MergeStopsIBIBaru.geojson')
.then(r => r.json())
.then(data => {

window.stopData = data;

console.log(
"Jumlah halte:",
data.features.length
);

});

// =========================
// DROPDOWN ROUTE
// =========================

function populateRoutes(data){

let select =
document.getElementById("routeSelect");

let routes = {};

data.features.forEach(f=>{

routes[
f.properties.route_id
] = f.properties.route_long_name;

});

Object.keys(routes)
.sort()
.forEach(routeId=>{

let option =
document.createElement("option");

option.value = routeId;

option.text =
routeId +
" - " +
routes[routeId];

select.appendChild(option);

});

}

// =========================
// DROPDOWN TRIP
// =========================

function populateTrips(routeId){

    if ($('#tripSelect').hasClass("select2-hidden-accessible")){
        $('#tripSelect').select2('destroy');
    }

    let tripSelect =
        document.getElementById("tripSelect");

    tripSelect.innerHTML =
        '<option value="">Pilih Trip</option>';

    let trips = {};

    let filteredFeatures =
        window.gtfsData.features.filter(
            f =>
            routeId === "" ||
            f.properties.route_id == routeId
        );

    console.log(
        "jumlah feature:",
        filteredFeatures.length
    );

    filteredFeatures.forEach(f=>{

        trips[f.properties.trip_id] =
            f.properties.trip_short_name;

    });

    Object.keys(trips)
    .sort()
    .forEach(tripId=>{

        let option =
            document.createElement("option");

        option.value = tripId;

        option.text =
            tripId +
            " - " +
            trips[tripId];

        tripSelect.appendChild(option);

    });

    $('#tripSelect').select2({
        width:'300px'
    });

    $('#routeSelect').on('change', function () {

    let routeId = $(this).val();

    console.log("route =", routeId);

    populateTrips(routeId);
});

}

// =========================
// TAMBAH RUTE KE PETA
// =========================

 const colors = [
    "#e41a1c",
    "#377eb8",
    "#4daf4a",
    "#984ea3",
    "#ff7f00",
    "#ffff33",
    "#a65628",
    "#f781bf",
    "#999999",
    "#00bcd4",
    "#8bc34a",
    "#795548"
];

let colorIndex = 0;

function addTripToMap(tripId){

let selectedFeatures =
window.gtfsData.features.filter(
f => f.properties.trip_id == tripId
);

if(selectedFeatures.length == 0){
return;
}

let lineColor = colors[colorIndex % colors.length];
colorIndex++;

let layer = L.geoJSON(selectedFeatures, {

    style: function(feature){

        return {
            color: lineColor,
            weight: 6,
            opacity: 1
        };
},

onEachFeature:function(feature,layer){

layer.bindPopup(

"<b>Route :</b> " +
feature.properties.route_id +

"<br><b>Trip :</b> " +
feature.properties.trip_id +

"<br><b>Nama :</b> " +
feature.properties.trip_short_name +

 "<br><b>KM_Baku :</b> " +
feature.properties.KM_baku +

"<br><b>Jenis :</b> " +
feature.properties.route_desc

);

}

}

).addTo(
selectedRouteLayer
);

map.fitBounds(
layer.getBounds()
);

}


// semua rute

function addAllTrips(routeId){

    let selectedFeatures =
        window.gtfsData.features.filter(f =>

            routeId == "" ||

            f.properties.route_id == routeId

        );

    if(selectedFeatures.length == 0){
        return;
    }

    L.geoJSON(selectedFeatures,{

        style:function(feature){
            let color = feature.properties.route_color;

            return {
                color: color ? "#" + color : "#3388ff",
                weight: 6,
                opacity: 1
            };

        },

        onEachFeature:function(feature,layer){

            layer.bindPopup(

                "<b>Route :</b> " +
                feature.properties.route_id +

                "<br><b>Trip :</b> " +
                feature.properties.trip_id +

                "<br><b>Nama :</b> " +
                feature.properties.trip_short_name +

                "<br><b>KM :</b> " +
                feature.properties.KM_baku

            );

        }

    }).addTo(selectedRouteLayer);

    map.fitBounds(selectedRouteLayer.getBounds());

}

// =========================
// TAMBAH HALTE KE PETA
// =========================

var halteIcon = L.icon({
    iconUrl: 'icon/halte.png',
    iconSize: [25, 25],
    iconAnchor: [12, 12]
});
 
function addStopsToMap(tripId){

let stopFeatures =
window.stopData.features.filter(
f =>
f.properties.trip_id ==
tripId
);

L.geoJSON(
stopFeatures,
{

pointToLayer:function(feature,latlng){

return L.marker(
latlng,
{
icon: halteIcon
}
);

},

onEachFeature: function(feature, layer){

    // Tooltip permanen
    layer.bindTooltip(
        feature.properties.stop_sequence + " - " +
        feature.properties.stop_name,
        {
            permanent: true,
            direction: "right",
            offset: [10, 0],
            className: "halte-label"
        }
    );

    // Popup tetap ada kalau ingin
    layer.bindPopup(
        "<b>Stop Sequence :</b> " + feature.properties.stop_sequence +
        "<br><b>Halte :</b> " + feature.properties.stop_name +
        "<br><b>Headsign :</b> " + feature.properties.stop_headsign
    );

}

}

).addTo(stopLayer);

}

// =========================
// EVENT ROUTE
// =========================



// =========================
// EVENT TAMBAH
// =========================

document
.getElementById("addTrip")
.addEventListener(
"click",
function(){

let tripId =
document
.getElementById("tripSelect")
.value;

if(tripId==""){
alert("Pilih trip terlebih dahulu");
return;
}

addTripToMap(
tripId
);

if(
document.getElementById("showStops").checked
){
    addStopsToMap(
    tripId
    );
}

}
);

// =========================
// EVENT CLEAR
// =========================

document
.getElementById("clearMap")
.addEventListener("click", function(){

    // Hapus layer
    selectedRouteLayer.clearLayers();
    stopLayer.clearLayers();

    // Reset Route
    $('#routeSelect').val('').trigger('change');

    // Reset Trip
    $('#tripSelect').val('').trigger('change');

});

// =========================
// EVENT SHOW STOPS
// =========================

document
.getElementById("showStops")
.addEventListener(
"change",
function(){

if(!this.checked){
    stopLayer.clearLayers();
}

}
);

// =========================
// EVENT Semua rute
// =========================
    
document
.getElementById("showAll")
.addEventListener("click",function(){

    let routeId =
    document.getElementById("routeSelect").value;

    addAllTrips(routeId);

});

// =========================
// DOWNLOAD GEOJSON PER TRIP
// =========================

document
.getElementById("downloadRoute")
.addEventListener("click", function(){

    // Ambil trip yang dipilih
    let tripId =
        document.getElementById("tripSelect").value;

    // Cek trip
    if(tripId === ""){
        alert("Pilih trip terlebih dahulu");
        return;
    }

    // =========================
    // DATA RUTE
    // =========================

    let tripFeatures =
        window.gtfsData.features.filter(
            f => f.properties.trip_id == tripId
        );

    // =========================
    // DATA HALTE
    // =========================

    let stopFeatures =
        window.stopData.features.filter(
            f => f.properties.trip_id == tripId
        );

    // Cek data
    if(tripFeatures.length === 0){
        alert("Data rute untuk trip ini tidak ditemukan");
        return;
    }

    if(stopFeatures.length === 0){
        alert("Data halte untuk trip ini tidak ditemukan");
        return;
    }

    // =========================
    // GEOJSON RUTE
    // =========================

    let routeGeoJSON = {
        type: "FeatureCollection",
        features: tripFeatures
    };

    // =========================
    // GEOJSON HALTE
    // =========================

    let stopGeoJSON = {
        type: "FeatureCollection",
        features: stopFeatures
    };

    // =========================
    // FUNCTION DOWNLOAD
    // =========================

    function downloadGeoJSON(data, fileName){

        let jsonString =
            JSON.stringify(data, null, 2);

        let blob =
            new Blob(
                [jsonString],
                {
                    type: "application/geo+json"
                }
            );

        let url =
            URL.createObjectURL(blob);

        let a =
            document.createElement("a");

        a.href = url;
        a.download = fileName;

        document.body.appendChild(a);

        a.click();

        document.body.removeChild(a);

        URL.revokeObjectURL(url);
    }

    // =========================
    // NAMA FILE
    // =========================

    let safeTripId =
        tripId.replace(
            /[^a-zA-Z0-9_-]/g,
            "_"
        );

    // =========================
    // DOWNLOAD RUTE
    // =========================

    downloadGeoJSON(
        routeGeoJSON,
        "Trip_" +
        safeTripId +
        "_Route.geojson"
    );

    // =========================
    // DOWNLOAD HALTE
    // =========================

    setTimeout(function(){

        downloadGeoJSON(
            stopGeoJSON,
            "Trip_" +
            safeTripId +
            "_Stops.geojson"
        );

    }, 500);

});

</script>

</body>

</html>
